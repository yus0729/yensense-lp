<style>
:root{
  --paper:#ffffff;
  --ink:#1a1913;
  --ink-mute:#6b675a;
  --line:#e4e2dd;
  --max:1200px;
  --font-en:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-min:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-sans);font-size:14px;line-height:2.2;letter-spacing:.05em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit}
h1{margin:0;font-weight:400}
.wrap{width:100%;max-width:var(--max);margin-inline:auto;padding-inline:clamp(20px,4vw,48px)}

/* header */
.hdr{border-bottom:1px solid var(--line)}
.hdr__in{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{font-family:var(--font-en);font-weight:500;font-size:15px;letter-spacing:-.01em;text-decoration:none}
.nav{display:flex;gap:clamp(20px,3vw,40px)}
.nav a{
  font-family:var(--font-en);font-size:10px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--ink);
  transition:opacity .5s var(--ease);
}
.nav a:hover{opacity:.45}
.lang-switch{display:flex;align-items:center;gap:8px}
.lang-switch a[aria-current="page"]{opacity:.45;pointer-events:none}
.lang-switch__sep{font-family:var(--font-en);font-size:9px;color:var(--line)}
@media(max-width:420px){.nav{gap:14px}.nav a{letter-spacing:.14em}}

/* company */
.sec .wrap{padding-block:clamp(88px,10vw,140px) clamp(120px,14vw,200px)}
.sec__grid{display:grid;gap:clamp(48px,7vw,72px)}
@media(min-width:900px){
  .sec__grid{grid-template-columns:220px minmax(0,1fr);gap:clamp(40px,6vw,96px)}
  .sec__label{position:sticky;top:48px;align-self:start}
}
.sec__label{
  font-family:var(--font-en);font-weight:400;font-size:10px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--ink-mute);
}
.sec__title{
  font-family:var(--font-min);font-weight:400;
  font-size:clamp(22px,2.8vw,34px);line-height:1.9;letter-spacing:.12em;
  font-feature-settings:"palt";
}
.sec__en{
  margin:18px 0 0;font-family:var(--font-en);font-weight:400;font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-mute);
}
.sec__body{margin-top:clamp(40px,6vw,72px)}
.company{margin:0;border-top:1px solid var(--line);max-width:680px}
.row{
  display:grid;grid-template-columns:160px 1fr;gap:20px;
  padding:20px 0;border-bottom:1px solid var(--line);align-items:baseline;
}
.row dt{
  margin:0;font-size:12px;letter-spacing:.1em;color:var(--ink-mute);
  display:flex;align-items:baseline;gap:12px;
}
.row dt small{font-family:var(--font-en);font-weight:400;font-size:9px;letter-spacing:.18em;text-transform:uppercase}
.row dd{margin:0;font-size:13px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.row dd ul{margin:0;padding-left:1.2em}
.row dd li{margin:3px 0}
@media(max-width:640px){.row{grid-template-columns:1fr;gap:2px;padding:17px 0}}

[data-reveal]{opacity:0;transform:translateY(16px);transition:opacity 1.4s var(--ease),transform 1.4s var(--ease)}
[data-reveal].in{opacity:1;transform:none;transition-delay:calc(var(--i,0)*150ms)}

/* footer */
.ftr .wrap{
  border-top:1px solid var(--line);padding-block:clamp(56px,8vw,96px) 48px;
  display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--ink-mute);letter-spacing:.05em;
}
.ftr a{color:var(--ink-mute);text-decoration:none;transition:color .4s}
.ftr a:hover{color:var(--ink)}
.ftr__links{display:flex;gap:24px;flex-wrap:wrap}
.ftr__links .en{font-family:var(--font-en);font-weight:500;font-size:10px;letter-spacing:.18em;text-transform:uppercase}

.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--paper);padding:12px 20px;z-index:200}
.skip:focus{left:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  [data-reveal]{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">本文へスキップ</a>

<header class="hdr">
  <div class="wrap hdr__in">
    <a class="brand" href="index.html">YenSense</a>
    <nav class="nav" aria-label="言語選択">
      <span class="lang-switch">
        <a href="/company.html" lang="en" hreflang="en">EN</a>
        <span class="lang-switch__sep" aria-hidden="true">/</span>
        <a href="/ja/company.html" lang="ja" hreflang="ja" aria-current="page">JP</a>
      </span>
    </nav>
  </div>
</header>

<main id="main">
  <section class="sec">
    <div class="wrap">
      <div class="sec__grid">
        <span class="sec__label" data-reveal>Company</span>
        <div>
          <h1 class="sec__title" data-reveal>会社概要</h1>
          <p class="sec__en" data-reveal lang="en" style="--i:1">Company profile</p>
          <div class="sec__body">
            <dl class="company" data-reveal style="--i:1">
              <div class="row"><dt>商号 <small>Name</small></dt><dd>YenSense株式会社</dd></div>
              <div class="row"><dt>代表者 <small>CEO</small></dt><dd>鈴木 陽</dd></div>
              <div class="row"><dt>所在地 <small>Location</small></dt><dd>東京都世田谷区</dd></div>
              <div class="row"><dt>資本金 <small>Capital</small></dt><dd>100万円</dd></div>
              <div class="row"><dt>事業内容 <small>Business</small></dt><dd>
                <ul>
                  <li>コンピュータソフトウェアの企画・開発・販売・保守</li>
                  <li>インターネットを利用した各種情報提供サービス</li>
                </ul>
              </dd></div>
            </dl>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="ftr">
  <div class="wrap">
    <p>© 2026 YenSense株式会社</p>
    <div class="ftr__links">
      <a href="privacy.html">プライバシーポリシー</a>
    </div>
  </div>
</footer>

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var targets = document.querySelectorAll('[data-reveal]');
  if (reduce || !('IntersectionObserver' in window)) {
    targets.forEach(function(el){ el.classList.add('in'); });
  } else {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, {threshold:0.1, rootMargin:'0px 0px -6% 0px'});
    targets.forEach(function(el){ io.observe(el); });
  }
})();
</script>
</body>
